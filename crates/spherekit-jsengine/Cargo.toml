[package]
name = "spherekit-jsengine"
description = "Safe Rust access to an embedded V8 runtime (rusty_v8), for embedding JavaScript in SphereKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["v8", "javascript", "embedding", "engine"]
categories = ["api-bindings", "development-tools"]

[dependencies]
# rusty_v8. Its build script downloads a prebuilt static V8 for the target from
# the denoland/rusty_v8 GitHub releases and caches it under
# `$CARGO_HOME/.rusty_v8`, so no C++ toolchain or V8 checkout is needed.
# `RUSTY_V8_ARCHIVE` / `RUSTY_V8_MIRROR` point it elsewhere for offline builds.
v8 = "152.2"
# ICU 78 common data, matching the ICU baked into the v8 prebuilt. Embedded so
# `Intl` works without shipping an `icudtl.dat` next to the executable.
deno_core_icudata = "0.78"
