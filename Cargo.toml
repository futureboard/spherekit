[workspace]
resolver = "3"
members = [
    "crates/spherekit-core",
    "crates/spherekit-render",
    "crates/spherekit-d3d11",
    "crates/spherekit-skia",
    "crates/spherekit-text",
    "crates/spherekit-layout",
    "crates/spherekit-svg",
    "crates/spherekit-image",
    "crates/spherekit-platform",
    "crates/spherekit-ui",
    "crates/spherekit-audio-ui",
    "crates/spherekit",
    "crates/spherekit-jsengine",
    "crates/spherekit-react",
    "crates/spherekit-css",
    "crates/spherekit-bridge",
    "crates/spherekit-cli",
    "crates/spherekit-python",
    "crates/spherekit-dotnet",
    "app/uigallery",
    "app/reactdemo",
    "app/musicplayer",
    "app/sysmonitor",
]

[workspace.package]
version = "2026.8.0"
edition = "2024"
rust-version = "1.87"
license = "BSD-3-Clause"
repository = "https://github.com/futureboard/spherekit"
authors = ["Futureboard Digital Technologies"]

[workspace.dependencies]
# --- internal ---
spherekit-core     = { path = "crates/spherekit-core",     version = "2026.8.0" }
spherekit-render   = { path = "crates/spherekit-render",   version = "2026.8.0" }
spherekit-d3d11    = { path = "crates/spherekit-d3d11",    version = "2026.8.0" }
spherekit-skia     = { path = "crates/spherekit-skia",     version = "2026.8.0" }
spherekit-text     = { path = "crates/spherekit-text",     version = "2026.8.0" }
spherekit-layout   = { path = "crates/spherekit-layout",   version = "2026.8.0" }
spherekit-svg      = { path = "crates/spherekit-svg",      version = "2026.8.0" }
spherekit-image    = { path = "crates/spherekit-image",    version = "2026.8.0" }
spherekit-platform = { path = "crates/spherekit-platform", version = "2026.8.0" }
spherekit-ui       = { path = "crates/spherekit-ui",       version = "2026.8.0" }
spherekit-audio-ui = { path = "crates/spherekit-audio-ui", version = "2026.8.0" }
spherekit-jsengine = { path = "crates/spherekit-jsengine", version = "2026.8.0" }
spherekit-react    = { path = "crates/spherekit-react",    version = "2026.8.0" }
spherekit-python   = { path = "crates/spherekit-python",   version = "2026.8.0" }
spherekit-dotnet   = { path = "crates/spherekit-dotnet",   version = "2026.8.0" }
spherekit-css      = { path = "crates/spherekit-css",      version = "2026.8.0" }
spherekit-bridge   = { path = "crates/spherekit-bridge",   version = "2026.8.0" }
spherekit          = { path = "crates/spherekit",          version = "2026.8.0" }

# --- foundation ---
bitflags   = "2.13"
bytemuck   = { version = "1.25", features = ["derive"] }
thiserror  = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing    = "0.1"
smallvec   = "1.15"
slotmap    = "1.0"
rustc-hash = "2.1"
parking_lot = "0.12"
crossbeam-utils = "0.8"

# --- gpu / platform ---
# Direct3D 11, DXGI, DirectComposition and DirectWrite. Each crate enables the
# API features it uses on top of this.
windows = { version = "0.62", default-features = false, features = ["std"] }
# CPU rasteriser for the fallback backend. The default feature set
# (binary-cache + pdf + jpeg) is deliberate: rust-skia publishes prebuilt
# binaries only for specific feature combinations, and this is the smallest one
# available for every desktop target. Changing it forces a from-source Skia
# build, which needs the LLVM/Ninja that `tools/bootstrap.ps1` puts in `.bin/`.
skia-safe = "0.157"
# Software presentation for the Skia backend: GDI, X11/Wayland, CoreGraphics.
softbuffer = { version = "0.4", default-features = false, features = ["x11", "wayland"] }
raw-window-handle = "0.6"
winit = "0.30.13"
pollster = "1.0"

# --- geometry / text / assets ---
lyon        = "1.0"
taffy       = { version = "0.13", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size"] }
ttf-parser  = "0.25"
rustybuzz   = "0.20"
fontdb      = "0.24"
swash       = "0.2"
unicode-bidi        = "0.3"
unicode-script      = "0.5"
unicode-linebreak   = "0.1"
unicode-segmentation = "1.12"
cssparser = "0.37"
image  = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
usvg   = { version = "0.48", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
